locale: en-US
site_theme: default
title: Eric Hoang
title_separator: "-"
name: Eric Hoang
description: Eric Hoang (Anh Minh Hoang), fourth-year VinUniversity undergraduate researching LLM safety and alignment, jailbreak defenses, and training-data poisoning.
words_per_minute: 200
read_more: disabled
# GitHub Pages project URL, inferred from this repository's origin.
url: https://amhoangwork-oss.github.io
baseurl: /erichoang
repository: amhoangwork-oss/erichoang
timezone: Asia/Ho_Chi_Minh
author:
  name: Eric Hoang
  bio: LLM safety and alignment research
  location: Hanoi, Vietnam
  employer: VinUniversity
  email: 23minh.ha@vinuni.edu.vn
atom_feed:
  hide: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
permalink: /writing/:title/
future: false
encoding: utf-8
include:
  - _pages
  - files
exclude:
  - mystuff
  - tmp
  - local
  - vendor
  - node_modules
  - scripts
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - files/bibtex1.bib
  - _portfolio
  - _talks
  - _teaching
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
collections:
  publications:
    output: true
    permalink: /research/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      section: writing
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      section: research
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
feed:
  path: feed.xml
