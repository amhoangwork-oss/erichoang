layout: archive
permalink: /year-archive/

{% for post in site.posts %}
<h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
<p>{{ post.date | date: '%B %-d, %Y' }}{% if post.review_draft %} · Draft for author review{% endif %}</p>
<p>{{ post.excerpt | strip_html }}</p>
{% endfor %}
